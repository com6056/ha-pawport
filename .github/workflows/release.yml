name: Release

# Push an annotated tag to release; its message is the release notes:
#   git tag -a v1.2.3 -F notes.md --cleanup=verbatim && git push origin v1.2.3
# --cleanup=verbatim keeps markdown headings, which git otherwise strips as
# comments. The notes go above GitHub's generated list, which only shows merged
# pull requests and so misses every change committed straight to main. A
# lightweight tag fails the run instead of releasing with no notes. A tag with
# a suffix (v1.2.3-beta.1) becomes a pre-release, which HACS offers only to
# users who opt into betas. The release is created here with pawport.zip
# already attached, built with the tag's version in manifest.json, because the
# repo uses immutable releases: assets cannot be added once a release is out.
# main keeps a 0.0.0 placeholder, so nobody bumps version files by hand.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          jq --arg v "$version" '.version = $v' custom_components/pawport/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/pawport/manifest.json
      - name: Zip
        run: cd custom_components/pawport && zip -r "$GITHUB_WORKSPACE/pawport.zip" . -x '__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Read the annotation from the API, not the checkout, which can turn
          # an annotated tag lightweight (actions/checkout#290).
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [[ "$(jq -r .object.type <<<"$ref")" != tag ]]; then
            echo "::error::$TAG is a lightweight tag. Delete it and push an annotated one whose message is the release notes."
            exit 1
          fi
          # A signed tag's message carries its signature block; drop it.
          notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message |
            sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d')
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::$TAG has an empty message. Delete it and push one whose message is the release notes."
            exit 1
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" pawport.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --notes "$notes" --generate-notes "${prerelease[@]}"
