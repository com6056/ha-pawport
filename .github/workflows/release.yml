name: Release

# Publish a release in the GitHub UI (or `gh release create vX.Y.Z
# --generate-notes`) and this attaches pawport.zip, built with the release's
# version in manifest.json. main keeps a 0.0.0 placeholder, so nobody bumps
# version files by hand.

on:
  release:
    types: [published]

permissions: {}

jobs:
  zip:
    name: Build pawport.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          jq --arg v "$version" '.version = $v' custom_components/pawport/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/pawport/manifest.json
      - name: Zip
        run: cd custom_components/pawport && zip -r "$GITHUB_WORKSPACE/pawport.zip" . -x '__pycache__/*'
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" pawport.zip --repo "$GITHUB_REPOSITORY" --clobber
