name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings > Devices & services > Pawport > three dots > Download diagnostics.
        Tokens and your email are removed automatically.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: Enable debug logging on the integration, reproduce, then paste the relevant lines.
      render: text
