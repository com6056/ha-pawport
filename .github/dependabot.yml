version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ["*"]
    # pytest-homeassistant-custom-component releases track every Home Assistant
    # beta and pin it exactly, so an automatic bump of either one can never
    # resolve against the other. Bump them together, by hand, when a new Home
    # Assistant release goes stable.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
